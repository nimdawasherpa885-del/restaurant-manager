<div class="login-page">
  <div class="login-box">
    <div class="logo">🍽️</div>
    <h1>Restaurant Manager</h1>
    <p class="subtitle">Create a new account</p>

    <div class="form-group">
      <label>Username</label>
      <input [(ngModel)]="username" type="text" placeholder="Choose a username" />
    </div>

    <div class="form-group">
      <label>Password</label>
      <input [(ngModel)]="password" type="password" placeholder="Choose a password" />
    </div>

    <div class="form-group">
      <label>Confirm Password</label>
      <input [(ngModel)]="confirm" type="password" placeholder="Repeat your password" />
    </div>

    @if (error) {
      <p class="error">{{ error }}</p>
    }
    @if (success) {
      <p class="success">{{ success }}</p>
    }

    <button (click)="signup()">Sign Up</button>

    <p class="switch">Already have an account? <a routerLink="/login">Login</a></p>
  </div>
</div>
