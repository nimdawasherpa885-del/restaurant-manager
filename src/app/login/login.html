<div class="login-page">
  <div class="login-box">
    <div class="logo">🍽️</div>
    <h1>Restaurant Manager</h1>
    <p class="subtitle">Sign in to continue</p>

    <div class="form-group">
      <label>Username</label>
      <input [(ngModel)]="username" type="text" placeholder="Enter username" />
    </div>

    <div class="form-group">
      <label>Password</label>
      <input [(ngModel)]="password" type="password" placeholder="Enter password" />
    </div>

    @if (error) {
      <p class="error">{{ error }}</p>
    }

    <button (click)="login()">Login</button>

    <p class="switch">Don't have an account? <a routerLink="/signup">Sign Up</a></p>
    <p class="hint">Default: <b>admin</b> / <b>1234</b></p>
  </div>
</div>
